<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a" />
      <stop offset="50%" stop-color="#141724" />
      <stop offset="100%" stop-color="#0b0d14" />
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2235" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#141724" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glow circles -->
  <circle cx="200" cy="180" r="280" fill="#6366f1" fill-opacity="0.12" filter="blur(80px)" />
  <circle cx="1000" cy="450" r="320" fill="#06b6d4" fill-opacity="0.10" filter="blur(90px)" />

  <!-- Logo Pill -->
  <g transform="translate(100, 80)">
    <rect width="56" height="56" rx="16" fill="url(#brand-grad)" />
    <text x="28" y="36" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="900" text-anchor="middle">IN</text>
    <text x="76" y="38" fill="#ffffff" font-family="'Inter', sans-serif" font-size="28" font-weight="800">InchPixels<tspan fill="#6366f1">.com</tspan></text>
  </g>

  <!-- Headline -->
  <text x="100" y="240" fill="#ffffff" font-family="'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    Inches to Pixels Converter
  </text>
  <text x="100" y="300" fill="url(#brand-grad)" font-family="'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Instant In to Px &amp; DPI Visualizer
  </text>

  <!-- Subtitle -->
  <text x="100" y="365" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="22" font-weight="400">
    High-precision conversion engine for UI designers, printmakers &amp; developers.
  </text>

  <!-- Feature Cards Row -->
  <g transform="translate(100, 420)">
    <!-- Card 1 -->
    <rect width="220" height="110" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="44" fill="#6366f1" font-family="'Inter', sans-serif" font-size="14" font-weight="700">DPI CALIBRATION</text>
    <text x="24" y="78" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">72 / 96 / 300</text>

    <!-- Card 2 -->
    <g transform="translate(250, 0)">
      <rect width="220" height="110" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="44" fill="#06b6d4" font-family="'Inter', sans-serif" font-size="14" font-weight="700">2D CANVAS</text>
      <text x="24" y="78" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">Width × Height</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(500, 0)">
      <rect width="220" height="110" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="44" fill="#10b981" font-family="'Inter', sans-serif" font-size="14" font-weight="700">CODE EXPORT</text>
      <text x="24" y="78" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">CSS &amp; Tailwind</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(750, 0)">
      <rect width="240" height="110" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="44" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="14" font-weight="700">STANDARD FORMULA</text>
      <text x="24" y="78" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">Pixels = In × DPI</text>
    </g>
  </g>
</svg>
